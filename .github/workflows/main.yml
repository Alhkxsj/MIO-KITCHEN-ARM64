name: "Build Tool (ARM64)"
permissions:
  contents: write
on:
  push:
    paths:
      - "bin/setting.ini"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Packages
        run: |
          python3 -m pip install -U --force-reinstall pip
          sudo apt update -y && sudo apt install -y python3-tk cpio f2fs-tools \
            python3-pil python3-pycryptodome python3-requests python3-pygments \
            python3-zstandard python3-asn1crypto python3-lxml python3-six python3-httpx \
            python3-cryptography python3-toml python3-lz4 python3-lzo python3-protobuf
          pip install -r requirements.txt
      - name: Build
        run: python3 build.py
      - name: Generate Release Content
        run: |
          python3 build.py grb
          python3 build.py ma
      - name: Upload release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          removeArtifacts: true
          name: "MIO-KITCHEN-${{ env.ver }}"
          tag: "CI_BUILD_${{ github.run_number }}"
          bodyFile: "body.md"
          artifacts: "*.zip"
